[package]
name = "SacrificeHelper"
namespace = "doombubbles"
description = "Adds more UI information when doing Temple and Paragon sacrifices so you know exactly what you'll get."
websiteUrl = "https://github.com/doombubbles/SacrificeHelper"

[package.dependencies]
LavaGang-MelonLoader = "0.7.3"
doombubbles-Btd6ModHelper = "3.6.5"

[build]
icon = "./Icon.png"
readme = "./README.md"
outdir = "bin"

[[build.copy]]
source = "./bin/Release/SacrificeHelper.dll"
target = "SacrificeHelper.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["bloons-td-6"]
categories = ["mods"]
